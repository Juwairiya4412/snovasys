<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #4338ca, #7c3aed);
  padding: 20px;
}
.login-card {
  width: 100%;
  max-width: 390px;
  background: white;
  padding: 36px;
  border-radius: 20px;
  box-shadow: 0 20px 60px #0004;
}
.logo {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  border-radius: 16px;
  background: #4f46e5;
  color: white;
  font-size: 28px;
}
h1 { text-align: center; margin: 0 0 8px; color: #111827; }
.subtitle { text-align: center; color: #6b7280; margin-bottom: 28px; }
label { display: block; font-size: 14px; font-weight: bold; margin: 16px 0 8px; }
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 15px;
}
input:focus { outline: 2px solid #818cf8; border-color: #4f46e5; }
.password-row { display: flex; gap: 8px; align-items: center; }
.password-row input { flex: 1; min-width: 0; }
.password-row button { border: 0; background: #eeeaff; padding: 12px; border-radius: 8px; cursor: pointer; }
.options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 16px 0 22px; }
.options label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: normal; }
.options input { width: auto; }
a { color: #4f46e5; text-decoration: none; }
.login-btn {
  width: 100%; padding: 14px; border: 0; border-radius: 9px;
  background: #4f46e5; color: white; font-size: 16px;
  font-weight: bold; cursor: pointer;
}
.login-btn:hover { background: #4338ca; }
.message { text-align: center; font-size: 14px; margin-top: 16px; color: #b91c1c; }
.signup { text-align: center; font-size: 14px; margin-top: 24px; color: #6b7280; }
</style>
</head>
<body>
<main class="login-card">
  <div class="logo">✦</div>
  <h1>TrustVault</h1>
  <p class="subtitle">Please sign in to your account</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com" required autocomplete="username">

    <label for="password">Password</label>
    <div class="password-row">
     <input id="password" type="password" placeholder="Enter your password" required minlength="12" maxlength="72" autocomplete="current-password">
      <button type="button" id="togglePassword">Show</button>
    </div>

    <div class="options">
      <label><input type="checkbox" id="remember"> Remember me</label>
      <a href="#" id="forgot">Forgot password?</a>
    </div>

    <button class="login-btn" type="submit">Sign In</button>
    <p class="message" id="message" role="status"></p>
  </form>

  <p class="signup">New here? <a href="#" id="signup">Create an account</a></p>
</main>

<script>
const password = document.getElementById("password");
const message = document.getElementById("message");
const form = document.getElementById("loginForm");
const submitButton = document.querySelector(".login-btn");
const signupLink = document.getElementById("signup");

document.getElementById("togglePassword").addEventListener("click", function () {
  const showing = password.type === "text";
  password.type = showing ? "password" : "text";
  this.textContent = showing ? "Show" : "Hide";
});

signupLink.addEventListener("click", function (event) {
  event.preventDefault();

  const isSignup = submitButton.dataset.mode === "signup";

  if (!isSignup) {
    submitButton.dataset.mode = "signup";
    document.querySelector("h1").textContent = "Create Account";
    document.querySelector(".subtitle").textContent = "Join TrustVault today";
    submitButton.textContent = "Create Account";
    signupLink.textContent = "Already registered? Sign in";
    password.autocomplete = "new-password";
    password.minLength = 12;
    message.textContent = "Choose a password with at least 12 characters.";
  } else {
    submitButton.dataset.mode = "login";
    document.querySelector("h1").textContent = "TrustVault";
    document.querySelector(".subtitle").textContent = "Please sign in to your account";
    submitButton.textContent = "Sign In";
    signupLink.textContent = "Create an account";
    password.autocomplete = "current-password";
    password.minLength = 12;
    message.textContent = "";
  }
});

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const isSignup = submitButton.dataset.mode === "signup";
  message.style.color = "#b91c1c";
  message.textContent = isSignup ? "Creating account..." : "Signing in...";

  try {
    const response = await fetch(isSignup ? "/api/signup" : "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: password.value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Request failed.");
    }
message.style.color = "#15803d";
message.textContent = data.message ||
  (isSignup ? "Account created successfully!" : "Signed in successfully!");

window.location.href = "/dashboard";
      } catch (error) {
    message.style.color = "#b91c1c";
    message.textContent = error.message || "Could not connect to the server.";
  }
});

document.getElementById("forgot").addEventListener("click", function (event) {
  event.preventDefault();
  message.textContent = "Password recovery is not set up yet.";
});
</script>
</body>
</html>
